<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Em construção — parpi</title>
  <meta name="description" content="Nova página em construção.">
  <style>
    :root {
      color-scheme: dark;
      --bg: #1d2021;
      --fg: #ebdbb2;
      --muted: #a89984;
      --accent: #fabd2f;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100%;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    main {
      width: min(36rem, calc(100% - 2.5rem));
      padding: 2rem 0;
    }

    .mark {
      margin: 0 0 1.5rem;
      color: var(--accent);
      font-size: 0.85rem;
      letter-spacing: 0.14em;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 650;
      letter-spacing: -0.03em;
      line-height: 1.05;
    }

    p {
      margin: 1rem 0 0;
      max-width: 28rem;
      color: var(--muted);
      font-size: 1.125rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <p class="mark">parpi</p>
    <h1>Em construção</h1>
    <p>Estou a preparar uma nova página. Volta em breve.</p>
  </main>
</body>
</html>
